<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>台账入口已迁移</title>
<style>
html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#F3F6FA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#20324A}
.box{width:min(560px,calc(100% - 40px));background:#fff;border:1px solid #DCE4EE;border-radius:10px;padding:30px 34px;box-shadow:0 10px 32px rgba(31,55,88,.08)}
h1{font-size:20px;margin:0 0 12px}p{font-size:14px;line-height:1.8;margin:8px 0;color:#53657C}
a{color:#114C8B;font-weight:600}.tip{font-size:12px;color:#8292A6;margin-top:18px;padding-top:14px;border-top:1px solid #EDF1F6}
</style>
<script>
(function(){
  var p=location.pathname.replace(/^\/hyhx-ledger/,'')||'/';
  var u='https://hyhx-ledger.pages.dev'+p+location.search+location.hash;
  var a=document.getElementById('go'); if(a) a.href=u;
  setTimeout(function(){location.replace(u);},1200);
})();
</script>
</head>
<body>
<div class="box">
<h1>台账入口已迁移</h1>
<p>旧地址已停用，正在进入新的 Cloudflare 台账系统，请稍候……</p>
<p><a id="go" href="https://hyhx-ledger.pages.dev/">立即进入新系统</a></p>
<p class="tip">新地址：hyhx-ledger.pages.dev　请更新收藏夹、二维码和群内链接。</p>
</div>
</body>
</html>
