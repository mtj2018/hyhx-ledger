<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沪渝高速改扩建工程 · 工程月报填报</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230F2C5C'/%3E%3Cpath d='M9 27 L14 6 M20 27 L23 12' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#101827; --navy:#0F2C5C; --navy-2:#16407F; --blue:#2F6FEB;
  --page:#EDF1F7; --paper:#fff; --mist:#F5F7FB; --line:#DCE3EF; --hair:#EDF1F7;
  --muted:#68727F; --up:#17734F; --down:#A84326;
}
body{
  background:var(--page); color:var(--ink);
  font:15px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:40px;
}
.num{font-variant-numeric:tabular-nums}

/* ---------- 顶部 ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:1px solid #0A2046}
.top-in{max-width:1530px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top-main{flex:1 1 360px;min-width:0}
.top-name{
  width:100%;display:block;background:transparent;border:0;color:#fff;
  font-size:21px;font-weight:700;letter-spacing:.01em;padding:2px 0;
  border-bottom:1px solid transparent;font-family:inherit;
}
.top-name:hover{border-bottom-color:#3C5C92}
.top-name:focus{outline:none;border-bottom-color:#8FB4FF}
.top-sub{font-size:12.5px;color:#B9CBE8;margin-top:4px;letter-spacing:.02em}
.top-sub span{color:#DFE8F7}
.top-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-size:12px;color:#D6E2F5;border:1px solid #38578A;padding:3px 9px;letter-spacing:.04em}
.saved{font-size:12px;color:#8FB4FF}
.ghost{
  font:12px/1 inherit;color:#DCE7F8;background:transparent;border:1px solid #45639A;
  padding:7px 12px;cursor:pointer;letter-spacing:.03em;
}
.ghost:hover{background:#173B75;border-color:#7FA6E8;color:#fff}
.ghost:focus-visible{outline:2px solid #8FB4FF;outline-offset:2px}

/* ---------- 两栏骨架 ---------- */
.shell{max-width:1530px;margin:0 auto;padding:20px 20px 0;display:grid;grid-template-columns:214px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:96px}
.rail nav{border-top:2px solid var(--navy);background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:13px 14px;text-decoration:none;
  color:var(--navy);border-bottom:1px solid var(--hair);letter-spacing:.02em;
}
.nav-item b{font-weight:600;font-size:12px;color:#9AA7B8;min-width:12px}
.nav-item span{font-size:14px;font-weight:600}
.nav-item:hover{background:var(--mist)}
.nav-item.is-on{background:var(--navy);color:#fff}
.nav-item.is-on b{color:#9FBCEF}
.rail-note{margin-top:14px;font-size:12px;line-height:1.75;color:var(--muted);padding:0 2px}
.rail-note em{font-style:normal;color:var(--navy)}

main{min-width:0}
.view{display:none}
.view.is-on{display:block}

/* ---------- 卡片 ---------- */
.card{background:var(--paper);border:1px solid var(--line);margin-bottom:16px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.card-head h2{font-size:15px;font-weight:700;color:var(--navy);letter-spacing:.03em}
.card-head h2:before{content:"";display:inline-block;width:3px;height:13px;background:var(--navy);margin-right:9px;vertical-align:-1px}
.card-head .hint{font-size:12px;color:var(--muted)}
.card-body{padding:6px 18px 16px}

/* ---------- 字段 ---------- */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.fields .span2{grid-column:1/-1}
.field{display:grid;grid-template-columns:124px minmax(0,1fr);align-items:center;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--hair)}
.field label{font-size:13px;color:var(--muted);letter-spacing:.02em;line-height:1.45}
.field input{
  width:100%;min-width:0;border:0;border-bottom:1px solid transparent;background:transparent;
  font-family:inherit;font-size:15px;line-height:1.5;color:var(--ink);padding:5px 2px;font-variant-numeric:tabular-nums;
}
.field input:hover{border-bottom-color:var(--line)}
.field input:focus{outline:none;background:#F8FAFE;border-bottom-color:var(--blue)}
.field input:focus-visible{box-shadow:inset 0 -2px 0 var(--blue)}

/* ---------- 表格 ---------- */
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl th{font-size:12px;font-weight:600;color:var(--navy);background:var(--mist);
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);letter-spacing:.03em}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--hair);font-size:14px;color:var(--ink);vertical-align:middle}
.tbl td input{width:100%;border:0;background:transparent;font-family:inherit;font-size:14px;line-height:1.5;color:var(--ink);padding:3px 0;text-align:right;font-variant-numeric:tabular-nums}
.tbl td input:hover{background:#F8FAFE}
.tbl td input.txt{text-align:left}
.tbl td input:focus{outline:none;background:#F8FAFE;box-shadow:inset 0 -2px 0 var(--blue)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.c{text-align:center}
.tbl tr.total td{font-weight:700;color:var(--navy);background:#F7FAFF;border-top:1px solid var(--line)}
.note{font-size:12px;line-height:1.8;color:var(--muted);padding:10px 18px 14px;border-top:1px solid var(--hair);grid-column:1/-1}

/* ---------- KPI ---------- */
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.kpi > div{padding:16px 18px;border-right:1px solid var(--hair)}
.kpi > div:last-child{border-right:0}
.kpi .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.kpi .v{font-size:25px;font-weight:700;color:var(--navy);letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .u{font-size:12px;color:var(--muted);margin-left:5px;font-weight:400}
.kpi input.v{width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;font-family:inherit;font-size:21px}
.kpi input.v:focus{outline:none;border-bottom-color:var(--blue);background:#F8FAFE}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:pre-line;line-height:1.55}

/* ---------- 完成条 ---------- */
.bars{padding:14px 18px 6px}
.brow{display:grid;grid-template-columns:96px minmax(0,1fr) 148px;gap:12px;align-items:center;margin-bottom:12px}
.brow .bl{font-size:13px;color:var(--muted)}
.brow .bv{font-size:14px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:12px;background:#EDF1F7;border:1px solid var(--line);position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--navy-2);display:block}
.track i.blue{background:var(--blue)}
.legend{display:flex;gap:18px;font-size:12px;color:var(--muted);padding:0 18px 14px}
.legend b{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}

/* ---------- 月度柱 ---------- */
.mchart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;align-items:end;
  height:158px;padding:8px 0 0;border-bottom:1px solid var(--line);margin:4px 0 0}
.mb{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.mb .mv{font-size:10.5px;color:var(--muted);text-align:center;margin-bottom:4px;font-variant-numeric:tabular-nums}
.mb i{display:block;background:var(--blue);min-height:1px;height:var(--h)}
.mb i.now{background:var(--navy)}
.mb .ml{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 2px;flex-wrap:wrap;gap:8px}
.mrow .mt{font-size:12.5px;color:var(--muted)}
.mrow .mt b{font-size:15px;color:var(--navy);font-variant-numeric:tabular-nums}

/* ---------- 进度测算 ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);margin-top:4px}
.tile{padding:15px 18px;border-right:1px solid var(--hair)}
.tile:last-child{border-right:0}
.tile .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.tile .v{font-size:23px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--navy)}
.tile .d{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.tile.warn .v{color:var(--down)}
.tile.good .v{color:var(--up)}

/* ---------- 地市 ---------- */
.share{position:relative}
.share .fill{position:absolute;left:0;bottom:0;height:3px;background:var(--blue)}
.share .amt{font-variant-numeric:tabular-nums}

/* ---------- 文件台账 ---------- */
.head-right{display:flex;align-items:center;gap:12px}
.btn-add{font-family:inherit;font-size:12px;line-height:1;color:var(--navy);background:var(--mist);border:1px solid var(--line);padding:7px 11px;cursor:pointer;letter-spacing:.03em}
.btn-add:hover{background:#E9EEF9;border-color:#BFD0EA}
.btn-add:focus-visible{outline:2px solid #8FB4FF;outline-offset:2px}

/* ---------- 文件台账（五个分组卡片） ---------- */
.fcard .card-head{padding:12px 14px 11px;border-bottom:0}
.ft{table-layout:fixed;min-width:880px}
.ft th{font-size:11.5px;padding:9px 8px;text-align:center}
.ft td{padding:8px 9px;border-bottom:1px solid var(--hair);vertical-align:middle;text-align:center}
.ft .rdx{color:#93A0B2;font-size:12.5px}
.ft .ce{min-height:26px;padding:5px 7px;border:1px solid transparent;border-radius:4px;
  font-size:13px;line-height:1.6;color:var(--ink);text-align:center;word-break:break-word;
  white-space:pre-wrap;outline:none;transition:.15s}
.ft .ce.nm{min-height:46px;padding-top:7px}
.ft .ce:hover{background:#F7FAFF;border-color:#DFE8F5}
.ft .ce:focus{background:#fff;border-color:#9DBBF0;box-shadow:0 0 0 3px rgba(22,64,127,.07)}
.ft .ce:empty::before{content:"—";color:#BAC4D2}
.fbtn{font-family:inherit;font-size:12px;line-height:1;padding:7px 12px;border-radius:6px;cursor:pointer;
  border:1px solid #CFDCEE;background:#fff;color:var(--navy);white-space:nowrap;transition:.15s}
.fbtn:hover{background:#F2F7FF;border-color:#8FB4FF;color:#16407F}
.fbtn-open{background:var(--navy);border-color:var(--navy);color:#fff}
.fbtn-open:hover{background:#16407F;border-color:#16407F;color:#fff}
.fbtn-mini{padding:7px 9px;color:#7E8B9C;border-color:#DFE8F5}
.fbtn-line{border-style:dashed;color:#8A96A8;padding:7px 14px}
.lnk{display:flex;gap:6px;justify-content:center}
.fdel{width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid #EFDADA;background:#fff;color:#B44A42;border-radius:6px;cursor:pointer;transition:.15s}
.fdel:hover{background:#FDF2F1;border-color:#E0A8A2;color:#9C342C}
.tblwrap{overflow-x:auto}
.files-tbl{table-layout:fixed;min-width:960px}
.files-tbl th{padding:8px;font-size:11.5px;letter-spacing:.05em}
.files-tbl tr.grow td{background:#EAF1FC;color:var(--navy);font-size:11.5px;font-weight:700;
  letter-spacing:.06em;padding:7px 10px;border-bottom:1px solid #D3E0F5}
.files-tbl tr.grow span{font-weight:400;color:var(--muted);margin-left:8px;letter-spacing:0}
.files-tbl tr.grow input.gtype{font-family:inherit;font-size:11.5px;font-weight:700;line-height:1.4;color:var(--navy);letter-spacing:.06em;
  background:transparent;border:0;padding:0;width:150px}
.files-tbl tr.grow input.gtype:focus{outline:none;background:#fff;box-shadow:inset 0 -1px 0 var(--blue)}
.files-tbl td{padding:6px 8px;vertical-align:middle;border-bottom:1px solid var(--hair)}
.files-tbl td input{width:100%;border:0;border-bottom:1px solid transparent;background:transparent;
  font-family:inherit;font-size:13px;line-height:1.6;color:var(--ink);padding:3px 2px;text-align:left}
.files-tbl td input:hover{border-bottom-color:var(--line)}
.files-tbl td input:focus{outline:none;background:#F8FAFE;border-bottom-color:var(--blue)}
.files-tbl td input.date{text-align:center;font-variant-numeric:tabular-nums}
.files-tbl textarea{display:block;width:100%;border:0;border-bottom:1px solid transparent;
  background:transparent;font-family:inherit;font-size:13px;line-height:1.6;color:var(--ink);padding:3px 2px;
  resize:none;overflow:hidden}
.files-tbl textarea:hover{border-bottom-color:var(--line)}
.files-tbl textarea:focus{outline:none;background:#F8FAFE;border-bottom-color:var(--blue)}
.files-tbl .idx{color:#9AA7B8;font-size:12.5px;text-align:center;font-variant-numeric:tabular-nums}
.linkbtn{display:block;width:100%;text-align:left;font-family:inherit;font-size:12.5px;line-height:1.5;color:var(--navy);
  background:transparent;border:0;border-bottom:1px dashed #C3D3E9;padding:3px 0;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkbtn.empty{color:#9AA7B8}
.linkbtn:hover{color:var(--blue);border-bottom-color:var(--blue)}
.del{font:12px/1 inherit;color:var(--down);background:transparent;border:0;cursor:pointer;padding:5px 4px}
.del:hover{text-decoration:underline}

/* ---------- 固化值 ---------- */
.locked{border-bottom-color:transparent!important;background:transparent!important;cursor:default;color:var(--ink)}
.locked:hover{border-bottom-color:transparent!important;background:transparent!important}
.locked:focus{outline:none!important;background:transparent!important;box-shadow:none!important;border-bottom-color:transparent!important}
.field .rv{font-family:inherit;font-size:15px;line-height:1.5;color:var(--ink);font-variant-numeric:tabular-nums;min-height:30px;display:flex;align-items:center;padding:5px 2px}
.field .rv .sep{color:#A8B3C4;margin:0}
.field .rv .u{color:var(--muted);font-size:13px;margin-left:0;font-family:inherit}
.field .rv .num{font-family:inherit;font-size:15px;line-height:1.5;color:var(--ink)}
.field .rv input{flex:1 1 auto;min-width:0;width:auto;padding:2px}

/* ---------- 本年执行 ---------- */
.yearbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.yb{padding:13px 18px;border-right:1px solid var(--hair)}
.yb:last-child{border-right:0}
.yb .k{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em}
.yb .v{font-size:21px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.yb .u{font-size:12px;color:var(--muted);margin-left:4px}
.yb.good .v{color:var(--up)}
.yb.bad .v{color:var(--down)}

/* ---------- 时序刻度 ---------- */
.track em.tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:#8496AE;display:block}
.track em.tick:after{content:"";position:absolute;left:-3px;top:-1px;width:8px;height:2px;background:#8496AE}
.legend i.tk{display:inline-block;width:2px;height:10px;background:#8496AE;margin-right:6px;vertical-align:-1px}
.kpi > div.good .v{color:var(--up)}
.kpi > div.bad .v{color:var(--down)}

/* ---------- 用地双栏表 ---------- */
.land-tbl th{background:#EAF1FC;font-size:11.5px;font-weight:700;color:var(--navy);
  letter-spacing:.06em;padding:7px 10px;border-bottom:1px solid #D3E0F5}
.land-tbl td{padding:7px 10px;font-size:13px;vertical-align:top;line-height:1.7}
.land-tbl td.k{color:var(--muted);font-size:12.5px}
.land-tbl td.v{color:var(--ink);font-variant-numeric:tabular-nums}
.land-tbl td.v .u{color:var(--muted);font-size:12.5px;margin:0}
.land-tbl td.v .sep{color:#A8B3C4;margin:0}
.land-tbl td.v.m2{white-space:nowrap;padding-right:14px}
.land-tbl td.v.mu{white-space:nowrap}
.land-tbl td.sep{border-left:1px solid var(--line)}
@media (max-width:980px){
  .yearbar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .yb:nth-child(2){border-right:0}
  .yb:nth-child(1),.yb:nth-child(2){border-bottom:1px solid var(--hair)}
}

/* ---------- 项目属性标签 ---------- */
.fields.fin .field{grid-template-columns:178px minmax(0,1fr)}
.fields.fin .field label{white-space:nowrap}

/* ---------- 可录入区高亮（仅投资与进度） ---------- */
#view-investment input:not([readonly]){background:#FFFDF1;border:1px solid #F1E6C3;border-radius:4px;
  padding:4px 8px;font-family:inherit;font-size:14px;line-height:1.5;color:var(--ink);
  text-align:right;font-variant-numeric:tabular-nums}
#view-investment input:not([readonly]):focus{background:#FFFDF1;border-color:#2F6FEB;outline:none;
  box-shadow:0 0 0 3px rgba(47,111,235,.12)}
#view-investment input.locked{background:transparent;border:0}
.edit-note{display:flex;align-items:center;gap:8px;font-size:12px;color:#6B7686;
  background:#fff;border:1px solid var(--line);border-left:3px solid #E2C25C;
  padding:8px 12px;margin-bottom:14px;letter-spacing:.02em}
.edit-note i{width:14px;height:14px;background:#FFFBEC;border:1px solid #E8D49B;border-radius:3px;display:block}

/* ---------- 两口 KPI 卡片并排（2:1） ---------- */
.inv-top{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.inv-top .card{margin-bottom:16px}
.inv-top .kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
.inv-top .kpi > div{padding:12px 16px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.inv-top .kpi > div:nth-child(2n){border-right:0}
.inv-top .kpi > div:nth-last-child(-n+2){border-bottom:0}
.inv-top .kpi .k{font-size:11.5px}
.inv-top .kpi .v{font-size:20px}
.inv-top .bars{padding:12px 16px 6px}
.inv-top .brow{grid-template-columns:64px minmax(0,1fr) auto}
.inv-top .brow .bv{font-size:12.5px}
.inv-top .legend{padding:8px 16px 12px;font-size:11.5px;gap:12px}
@media (max-width:1080px){.inv-top{grid-template-columns:minmax(0,1fr)}}

/* ---------- 表格横向滚动（窄屏） ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tw .land-tbl{min-width:640px}
.tw .files-tbl{min-width:960px}

/* ---------- 固定资产投资 ---------- */
.fa-tab{flex:0 0 auto;white-space:nowrap;font-family:inherit;font-size:13px;line-height:1;letter-spacing:.02em;
  padding:8px 15px;border:1px solid var(--line);background:#fff;color:#3C4A5E;cursor:pointer;border-radius:6px;font-weight:500}
.fa-tab:hover{background:var(--mist)}
.fa-tab.on{background:#16407F;border-color:#16407F;color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(22,64,127,.22)}
.fa-tbl{min-width:0;table-layout:fixed;width:100%}
.fa-tbl th{white-space:nowrap}
.fa-tbl th.c{text-align:center}
.fa-tbl td.nm{color:var(--navy);font-weight:600;letter-spacing:.02em}
.fa-tbl td.mut{color:#AEB8C6}
.fcr-head{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:0 10px 10px;border-bottom:1px solid #E4EAF3;overflow:hidden;box-sizing:border-box}
.fcr-top{font-size:13.5px;font-weight:600;color:#4A5566;letter-spacing:.04em;white-space:nowrap;line-height:1.3}
.fcr-sub{font-size:11.5px;line-height:1.62;color:#8590A2;text-align:center;letter-spacing:.01em}
.fcr-tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.fcr-tbl th{background:#F5F7FB;border-bottom:1px solid #DCE3EF;padding:8px 6px;font-size:12.5px;font-weight:600;color:#0F2C5C;text-align:center;white-space:nowrap}
.fcr-tbl td{border-bottom:1px solid #EEF2F8;padding:4px 6px;font-size:12.5px;color:#0F2C5C;text-align:right}
.fcr-tbl td:first-child{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcr-in{width:100%;box-sizing:border-box;border:1px solid #F4EBD5;background:#FFFDF6;border-radius:4px;font-family:inherit;font-size:12.5px;line-height:1.5;color:#B3591A;padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums}
.fcr-in:focus{outline:none;border-color:#2F6FEB;background:#fff}
.fcr-in[readonly]{background:transparent;border-color:transparent;color:#0F2C5C}

  function buildFile(name, ts) {
    if (name.indexOf("xt-rep-") === 0) {
      var k = name.slice(7, name.length - 5);
      return { ts: ts, v: cloneRep((DB.reports || {})[k] || {}) };
    }
    if (name.indexOf("xt-jr-") === 0) {
      var c = junc(name.slice(6, name.length - 5));
      return { ts: ts, v: cloneRep((DB.jr || {})[c] || {}) };
    }
    if (name.indexOf("xt-tsf-") === 0) {
      var k2 = name.slice(7, name.length - 5), days = {};
      Object.keys(DB.tsf || {}).forEach(function (d) {
        var rec = (DB.tsf[d] || {})[k2];
        if (rec !== undefined) days[d] = cloneRep(rec);
      });
      return { ts: ts, days: days };
    }
    return { ts: ts, v: cloneRep(DB.tsfBase || {}) };
  }

  /* 以云端最新内容为基础，只把本页改过的叶子覆盖上去 */
  function recombine(name, cf, lf, base) {
    if (name.indexOf("xt-tsf-") === 0) {
      var days = cloneRep((cf && cf.days) || {}), k = name.slice(7, name.length - 5);
      Object.keys(lf.days || {}).forEach(function (d) {
        var bd = base && base.tsf && (base.tsf[d] || {})[k];
        days[d] = mrg(days[d], lf.days[d], bd);
        /* 提交锁的两个标记以本机为准：本机没有就删掉云端的，避免 lkw 永远留在云端 */
        ["lk", "lkw"].forEach(function (fk) {
          if (!(fk in (lf.days[d] || {})) && days[d] && (fk in days[d])) delete days[d][fk];
        });
      });
      return { ts: lf.ts, days: days };
    }
    var bv = null;
    if (name.indexOf("xt-rep-") === 0) {
      var k2 = name.slice(7, name.length - 5);
      bv = base && base.reports && base.reports[k2];
    } else if (name.indexOf("xt-jr-") === 0) {
      var c2 = junc(name.slice(6, name.length - 5));
      bv = base && base.jr && base.jr[c2];
    } else { bv = base && base.tsfBase; }
    return { ts: lf.ts, v: mrg(cf && cf.v, lf.v, bv) };
  }

  function pushFailed(names, msg) {
    markPend(names);
    flag("云端未同步（" + msg + "），已记入待推队列，稍后自动重试", false);
    tsfSync("err");
  }

  /* 统一空值写法：缺 a/b/lk 视为 ""/""/0，lkw 为假就删掉；用于比对，避免把空记录当改动 */
  function normTsf(o) {
    var r = cloneRep(o) || {}, days = r.days || {};
    Object.keys(days).forEach(function (d) {
      var x = cloneRep(days[d]) || {};
      if (!("a" in x)) x.a = "";
      if (!("b" in x)) x.b = "";
      if (!("lk" in x)) x.lk = 0;
      if (!x.lkw) delete x.lkw;
      days[d] = x;
    });
    r.days = days;
    return r;
  }
  function normFile(n, o) { return n.indexOf("xt-tsf-") === 0 ? normTsf(o) : cloneRep(o); }

  function doPushFiles(names, round) {
    round = round || 1;
    names = (names || []).filter(function (v, i, a) { return a.indexOf(v) === i; });
    if (!names.length) return Promise.resolve(true);
    if (!ONLINE) return Promise.resolve(true);
    if (!SYNC_OK) { pushFailed(names, "尚未连通云端"); return Promise.resolve(false); }
    var base = cloneRep(BASE0);
    var ts = Date.now();
    return readAll().then(function (all) {
      var want = {}, body = { files: {} }, bad = [];
      names.forEach(function (n) {
        var lf = buildFile(n, ts), cf = all[n];
        want[n] = normFile(n, cf ? recombine(n, cf, lf, base) : lf);
        if (cf && same(normFile(n, cf), want[n])) delete want[n];
      });
      if (!Object.keys(want).length) { clearPend(names); snap(); return true; }
      Object.keys(want).forEach(function (n) { body.files[n] = { content: JSON.stringify(want[n]) }; });
      return xfetch(api(), { method: "PATCH", headers: hdr(), body: JSON.stringify(body) }, TO_MS)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); })
        .then(function () { return readAll(); })
        .then(function (back) {
          Object.keys(want).forEach(function (n) { if (!same(back[n], want[n])) bad.push(n); });
          if (!bad.length) {
            clearPend(names);
            snap();
            tsfSync("ok", ts);
            flag("已保存并同步云端 · " + new Date(ts).toLocaleTimeString(), true);
            return true;
          }
          if (round < 3) return doPushFiles(bad.concat(pendNames()), round + 1);
          pushFailed(bad, "写入被覆盖");
          return false;
        });
    }).catch(function (e) {
      var msg = e && e.name === "AbortError" ? "请求超时" : (e && e.message ? e.message : String(e));
      if (round < 3) return doPushFiles(names, round + 1);
      pushFailed(names, msg);
      return false;
    });
  }

  function doPush(round) {
    return doPushFiles(Object.keys(fileKeys()).concat(pendNames()), round);
  }

  function pushCloud() {
    if (!ONLINE) return Promise.resolve(true);
    var run = function () { return doPush(1); };
    pushQueue = pushQueue.then(run, run);
    return pushQueue;
  }

  function pullCloud() {
    return readAll().then(function (all) {
      var cloud = assemble(all), cts = all.cts || 0;
      var local = { reports: DB.reports || {}, jr: DB.jr || {}, tsf: DB.tsf || {}, tsfBase: DB.tsfBase || {} };
      var oldBase = BASE0 || { reports: {}, jr: {}, tsf: {}, tsfBase: {} };
      var merged = mrg(cloud, local, oldBase);
      /* 上次没写成功的文件：以本机为准保住数据，随后自动补推 */
      (PEND || []).forEach(function (n) {
        if (n.indexOf("xt-rep-") === 0) {
          var k = n.slice(7, n.length - 5);
          if (local.reports[k] !== undefined) merged.reports[k] = cloneRep(local.reports[k]);
        } else if (n.indexOf("xt-jr-") === 0) {
          var c = junc(n.slice(6, n.length - 5));
          if (local.jr[c] !== undefined) merged.jr[c] = cloneRep(local.jr[c]);
        } else if (n.indexOf("xt-tsf-") === 0) {
          var k2 = n.slice(7, n.length - 5);
          Object.keys(local.tsf || {}).forEach(function (d) {
            if ((local.tsf[d] || {})[k2] !== undefined) {
              (merged.tsf[d] = merged.tsf[d] || {})[k2] = cloneRep(local.tsf[d][k2]);
            }
          });
        } else if (n === F_BASE) {
          merged.tsfBase = cloneRep(local.tsfBase);
        }
      });
      DB = {
        ts: Math.max(cts, DB.ts || 0),
        reports: merged.reports || {}, jr: merged.jr || {},
        tsf: merged.tsf || {}, tsfBase: merged.tsfBase || {}
      };
      BASE0 = cloneRep(cloud);
      /* 清掉上次中断留下的「提交中」标记 */
      Object.keys(DB.tsf || {}).forEach(function (d0) {
        Object.keys(DB.tsf[d0] || {}).forEach(function (k0) {
          var r0 = DB.tsf[d0][k0];
          if (r0 && r0.lkw) delete r0.lkw;
        });
      });
      SYNC_OK = true;
      persistLocal();
      renderAll();
      try { renderJr(); } catch (e) {}
      if (changedPaths().length) pushCloud();
      return true;
    }).catch(function (e) {
      SYNC_OK = false;
      flag("云端读取失败（" + (e && e.message ? e.message : e) + "），本页改动只存本机，稍后自动重试", false);
      return false;
    });
  }

  function applyRemote() { /* v2 由 pullCloud 直接接管 */ }

  document.addEventListener("click", function (e) {
    var t = e.target && e.target.closest ? e.target.closest("[data-sync-retry]") : null;
    if (!t) return;
    e.preventDefault();
    pushCloud();
  });
  setInterval(function () {
    if (ONLINE && SYNC_OK && PEND.length) pushCloud();
  }, 60000);


  /* ---- 标段成组：土建10标 有「路基填筑(t10a)」「路基挖方(t10b)」两行，共用一个提交按钮 ---- */
  function tsfGrp(k) {
    var rows = TG.rows, i, a = -1, b;
    for (i = 0; i < rows.length; i++) { if (rows[i].k === k) { a = i; break; } }
    if (a < 0) return [k];
    while (a > 0 && !rows[a].nm) a--;
    b = a;
    while (b + 1 < rows.length && !rows[b + 1].nm) b++;
    var out = [];
    for (var j = a; j <= b; j++) out.push(rows[j].k);
    return out;
  }
  function tsfGrpN() { var n = 0; TG.rows.forEach(function (r) { if (r.nm) n++; }); return n; }
  function tsfGrpLk(d, k) {
    var day = (DB.tsf || {})[d] || {};
    return tsfGrp(k).every(function (x) { return !!(day[x] && day[x].lk); });
  }
  function tsfGrpWait(d, k) {
    var day = (DB.tsf || {})[d] || {};
    return tsfGrp(k).some(function (x) { return !!(day[x] && day[x].lkw); });
  }
  function tsfGrpSet(d, k, field, on) {
    tsfGrp(k).forEach(function (x) {
      var r0 = tsfRec(d, x, true);
      if (on) { r0[field] = 1; if (field === "lk") delete r0.lkw; }
      else { delete r0[field]; if (field === "lk") r0.lk = 0; }
    });
  }

  tsfBoot();
  renderAll();
  renderJr();
  /* 本机 file:// 打开不再自动拉取线上数据；只有线上访问才同步 */
  if (ONLINE) pullCloud();
})();
</script>
</body>
